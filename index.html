<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スコア送信フォーム (Supabase)</title>
    <style>
      :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      body { margin: 0; background: #0b1020; color: #e6e8ef; }
      .wrap { max-width: 720px; margin: 48px auto; padding: 24px; }
      .card { background: #121933; border: 1px solid #28314f; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { color: #aab0c2; }
      label { display: block; margin: 12px 0 6px; font-weight: 600; }
      input, select, button { font: inherit; }
      input, select {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #344063; background: #0f152b; color: #e6e8ef;
        box-sizing: border-box;
      }
      input:focus, select:focus { outline: 2px solid #4f8cff55; border-color: #4f8cffaa; }
      .row { display: grid; grid-template-columns: 1fr 160px; gap: 12px; }
      .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
      button {
        padding: 12px 16px; border-radius: 12px; border: 1px solid #4f8cff; background: #4f8cff; color: white; cursor: pointer; font-weight: 700;
      }
      button[disabled] { opacity: .6; cursor: not-allowed; }
      .muted { color: #96a0b8; font-size: 14px; }
      .ok { color: #79ffa1; }
      .err { color: #ff7e79; }
      .list { margin-top: 20px; border-top: 1px dashed #2a3557; padding-top: 16px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #202a49; font-variant-numeric: tabular-nums; }
      th { color: #9fb2ff; }
      tr[data-id] { cursor: pointer; }
      tr[data-id]:hover { background: #1a2240; }
      .small { font-size: 12px; color: #8b93a8; }
      .footer { margin-top: 18px; }
      code { background: #0f152b; padding: 2px 6px; border-radius: 8px; border: 1px solid #263157; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>スコア送信フォーム</h1>
        <p class="muted">種目、名前、点数を入力してください</p>

        <form id="score-form">
          <label for="type">種目</label>
          <select id="type" name="type" required>
            <option value="0">ボッチャ</option>
            <option value="1">コーンホール</option>
            <option value="2">モルック</option>
          </select>

          <label for="username">名前</label>
          <input id="username" name="username" type="text" placeholder="例: ゆうか" required />

          <label for="text">点数</label>
          <div class="row">
            <input id="text" name="text" type="number" min="0" max="10000000000000000" step="1" placeholder="例: 92" required />
            <button id="submit-btn" type="submit">決定</button>
          </div>
          <div id="status" class="actions muted">準備中…</div>
        </form>

        <div class="list">
          <div class="muted">最近追加されたデータ（最新10件）</div>
          <table>
            <thead>
              <tr><th style="width:30%">名前</th><th style="width:20%">点数</th><th style="width:10%">タイプ</th><th>作成日時</th></tr>
            </thead>
            <tbody id="rows"><tr><td colspan="4" class="small">読み込み中…</td></tr></tbody>
          </table>
          <div class="actions">
            <button id="show-all-btn" type="button">全件表示</button>
            <button id="show-latest-btn" type="button">最新10件に戻す</button>
          </div>
          <div class="small">※行をクリックすると削除できます</div>
        </div>

        <div class="footer small">https://hakudaku0510.github.io/SHISHI_display/でデータを表示</div>
      </div>
    </div>

    <script type="module">
      const SUPABASE_URL = "https://vsixwkiftbdapohqycmq.supabase.co/";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzaXh3a2lmdGJkYXBvaHF5Y21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcxMTcxNjAsImV4cCI6MjA1MjY5MzE2MH0.jOXF0pFF33m-u9uj1b-hNs0g_9Eg4g2C_GNbkDBcl88";

      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const $ = (sel) => document.querySelector(sel);
      const form = $("#score-form");
      const statusEl = $("#status");
      const btn = $("#submit-btn");
      const rows = $("#rows");
      const showAllBtn = $("#show-all-btn");
      const showLatestBtn = $("#show-latest-btn");
      const sportNames = {
        0: "ボッチャ",
        1: "コーンホール",
        2: "モルック",
      };

      function setStatus(text, kind = "muted") {
        statusEl.className = `actions ${kind}`;
        statusEl.textContent = text;
      }

      // 最新10件
      async function refreshList() {
        await loadData(false);
      }

      // 全件
      async function showAll() {
        await loadData(true);
      }

      // 共通データ取得関数
      async function loadData(all = false) {
        const query = supabase.from("Test").select("id, username, text, type, created_at").order("created_at", { ascending: false });
        if (!all) query.limit(10);

        const { data, error } = await query;

        if (error) {
          rows.innerHTML = `<tr><td colspan="4" class="err">取得エラー: ${error.message}</td></tr>`;
          return;
        }
        if (!data || data.length === 0) {
          rows.innerHTML = `<tr><td colspan="4" class="small">まだデータがありません。</td></tr>`;
          return;
        }

        rows.innerHTML = data
          .map(
            (r) => `
              <tr data-id="${r.id}">
                <td>${escapeHtml(r.username)}</td>
                <td>${r.text}</td>
                <td>${sportNames[r.type] ?? `不明 (${r.type})`}</td>
                <td>${fmt(r.created_at)}</td>
              </tr>`
          )
          .join("");

        // 行クリックで削除
        rows.querySelectorAll("tr[data-id]").forEach((tr) => {
          tr.addEventListener("click", async () => {
            const id = tr.getAttribute("data-id");
            if (confirm("このデータを削除しますか？")) {
              const { error } = await supabase.from("Test").delete().eq("id", id);
              if (error) {
                alert("削除失敗: " + error.message);
              } else {
                await loadData(all); // 削除後も同じモードで更新
              }
            }
          });
        });
      }

      function fmt(iso) {
        const d = new Date(iso);
        const z = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const username = String(formData.get("username") || "").trim();
        const text = Number(formData.get("text"));
        const type = Number(formData.get("type"));
        if (!username || Number.isNaN(text) || ![0, 1, 2].includes(type)) {
          setStatus("入力を確認してください", "err");
          return;
        }
        btn.disabled = true;
        setStatus("送信中…");
        const { error } = await supabase.from("Test").insert({ username, text, type });
        if (error) {
          setStatus(`送信失敗: ${error.message}`, "err");
        } else {
          setStatus("送信しました！", "ok");
          form.reset();
          await refreshList();
        }
        btn.disabled = false;
      });

      // ボタンイベント
      showAllBtn.addEventListener("click", showAll);
      showLatestBtn.addEventListener("click", refreshList);

      setStatus("接続中…");
      supabase.from("Test").select("count", { count: "exact", head: true })
        .then(({ error }) => {
          if (error) setStatus(`接続エラー: ${error.message}`, "err");
          else setStatus("準備OK");
        });
      refreshList();
    </script>
  </body>
</html>
